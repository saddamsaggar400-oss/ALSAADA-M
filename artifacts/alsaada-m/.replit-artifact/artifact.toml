kind = "web"
previewPath = "/"
title = "بطاقة إسعاد | Esaad Card"
description = "A responsive Arabic registration experience for UAE families applying for an Esaad membership card, with benefits, payment, verification, and confirmation flows."
version = "1.0.0"
id = "artifacts/alsaada-m"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18226

[services.development]
run = "pnpm --filter @workspace/alsaada-m run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alsaada-m", "run", "build" ]
serve = "static"
publicDir = "artifacts/alsaada-m/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18226"
BASE_PATH = "/"
